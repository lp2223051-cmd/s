<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包剪揼大戰 - 進階網頁版</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }

        .reset-btn {
            background: none;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #6b7280;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background-color: #f3f4f6;
            color: var(--text);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .score-label {
            font-size: 0.9rem;
            color: #64748b;
        }

        .score-num {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .arena {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 25px 0;
            min-height: 120px;
        }

        .hand-display {
            font-size: 4rem;
            transition: transform 0.1s ease;
        }

        .vs-text {
            font-weight: 800;
            color: #94a3b8;
            font-size: 1.2rem;
        }

        /* 搖晃動畫 */
        .shake-left {
            animation: shakeLeft 0.5s ease infinite;
        }
        .shake-right {
            animation: shakeRight 0.5s ease infinite;
        }

        @keyframes shakeLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes shakeRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }

        .status-message {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 1.5em;
            margin-bottom: 25px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .choice-btn {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px 10px;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .choice-btn span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
        }

        .choice-btn:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1);
            background-color: #ffffff;
        }

        .choice-btn:active {
            transform: translateY(-1px);
        }

        .win-color { color: #16a34a; }
        .lose-color { color: #dc2626; }
        .draw-color { color: #d97706; }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="header">
            <h1>包剪揼大戰</h1>
            <button class="reset-btn" onclick="resetGame()">重新開始</button>
        </div>

        <div class="scoreboard">
            <div class="score-item">
                <span class="score-label">玩家</span>
                <span class="score-num" id="player-score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">電腦</span>
                <span class="score-num" id="computer-score">0</span>
            </div>
        </div>

        <div class="arena">
            <div class="hand-display" id="player-hand">✊</div>
            <div class="vs-text">VS</div>
            <div class="hand-display" id="computer-hand">✊</div>
        </div>

        <div class="status-message" id="status-text">點擊下方按鈕開始出招！</div>

        <div class="controls">
            <button class="choice-btn" onclick="playRound('包')">
                🖐️
                <span>包</span>
            </button>
            <button class="choice-btn" onclick="playRound('剪')">
                ✌️
                <span>剪</span>
            </button>
            <button class="choice-btn" onclick="playRound('揼')">
                ✊
                <span>揼</span>
            </button>
        </div>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let isPlaying = false;

        const handEmojis = {
            '包': '🖐️',
            '剪': '✌️',
            '揼': '✊'
        };

        function playRound(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            const playerHand = document.getElementById('player-hand');
            const computerHand = document.getElementById('computer-hand');
            const statusText = document.getElementById('status-text');

            playerHand.textContent = '✊';
            computerHand.textContent = '✊';
            playerHand.classList.add('shake-left');
            computerHand.classList.add('shake-right');
            statusText.textContent = '包...剪...揼！';
            statusText.className = 'status-message';

            setTimeout(() => {
                playerHand.classList.remove('shake-left');
                computerHand.classList.remove('shake-right');

                const choices = ['包', '剪', '揼'];
                const computerChoice = choices[Math.floor(Math.random() * 3)];

                playerHand.textContent = handEmojis[playerChoice];
                computerHand.textContent = handEmojis[computerChoice];

                if (playerChoice === computerChoice) {
                    statusText.textContent = '平手！再來一次！';
                    statusText.classList.add('draw-color');
                } else if (
                    (playerChoice === '包' && computerChoice === '揼') ||
                    (playerChoice === '剪' && computerChoice === '包') ||
                    (playerChoice === '揼' && computerChoice === '剪')
                ) {
                    statusText.textContent = '你贏了這回合！🎉';
                    statusText.classList.add('win-color');
                    playerScore++;
                    document.getElementById('player-score').textContent = playerScore;
                } else {
                    statusText.textContent = '電腦贏了這回合！😈';
                    statusText.classList.add('lose-color');
                    computerScore++;
                    document.getElementById('computer-score').textContent = computerScore;
                }

                isPlaying = false;
            }, 600);
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            document.getElementById('player-score').textContent = '0';
            document.getElementById('computer-score').textContent = '0';
            document.getElementById('player-hand').textContent = '✊';
            document.getElementById('computer-hand').textContent = '✊';
            const statusText = document.getElementById('status-text');
            statusText.textContent = '分數已重設，請重新出招！';
            statusText.className = 'status-message';
        }
    </script>
</body>
</html>
